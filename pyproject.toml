[project]
name = "rxradar"
version = "0.1.0"
description = "Public early-warning system for US drug shortages, built only from public government data."
authors = [{ name = "Anoop Ibrampur" }]
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.scripts]
rxradar = "rxradar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network APIs; skipped unless RXRADAR_LIVE=1"]
